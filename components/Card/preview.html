<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card — preview</title>
<style>
  body { margin: 0; padding: var(--space-l); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-l); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var Card = window.PersonalDS.Card, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' },
      h(Card, { title: 'Slow-roast tomatoes' }, 'Halve, season and roast low for two hours.'),
      h(Card, { title: 'Slow-roast tomatoes', surface: 'mid' }, 'Halve, season and roast low for two hours.')));
</script>
</body>
</html>
