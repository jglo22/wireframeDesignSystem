<!doctype html>
<html>
<head><meta charset="utf-8"><title>Headings — preview</title>
<style>
  body { margin: 0; padding: var(--space-xl); background: var(--surface-page); }
  .body { margin: var(--space-m) 0 0; color: var(--text-primary); max-width: var(--reading-max); }
  .spec { margin: var(--space-l) 0 0; color: var(--text-muted); font-family: var(--font-body); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.PersonalDS.Headings, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(H, { level: 1 }, 'Slow-roast tomatoes with thyme'),
      h('p', { className: 'body font-m' }, 'Halve the tomatoes, season well and roast low for two hours until they slump and concentrate.'),
      h('p', { className: 'spec font-xs' }, 'page-heading · font-4xl · font-display · weight-extrabold · text-primary'),
      h(H, { level: 2, style: { marginTop: 'var(--space-xl)' } }, 'What you need'),
      h('p', { className: 'spec font-xs' }, 'subheading-1 · font-3xl · font-display · weight-bold · text-primary')));
</script>
</body>
</html>
