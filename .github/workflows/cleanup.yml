# One-off: delete the leftover side branch that still holds pre-rewrite history.
name: Delete leftover branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/claude/amazing-galileo-99ch9m" || true
