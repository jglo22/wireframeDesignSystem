# One-off: after the history was rewritten to remove a personal email, recreate every
# release and tag on the rewritten commits. Deleted again in the next commit.
name: Retag after history rewrite

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: releases

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            gh release delete "$t" --yes --cleanup-tag || true
          done
          for t in $(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done
      - name: Recreate a release for each version, at the first commit that has it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seen=""
          for c in $(git rev-list --reverse HEAD); do
            v="v$(git show "$c:package.json" 2>/dev/null | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>{try{console.log(JSON.parse(d).version)}catch{console.log("")}})')"
            [ "$v" = "v" ] && continue
            case " $seen " in *" $v "*) continue;; esac
            seen="$seen $v"
            notes="$(awk -v ver="${v#v}" '$0 ~ "^## " ver " " {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
            gh release create "$v" --target "$c" --title "$v" --notes "${notes:-See CHANGELOG.md}" || echo "skip $v"
          done
